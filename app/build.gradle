plugins {
    alias(libs.plugins.android.application)
}

def configuredApiUrl = providers.gradleProperty('VIETTABLE_API_BASE_URL').orElse('')
def releaseApiUrl = configuredApiUrl.get()
// Public origin only. Preview protection credentials must never be compiled into Android.
def cloudPreviewApiUrl = 'https://viettable-staging-hienkhanhvu981.vercel.app'
// New Vercel account, Production domain (public; no Vercel credential is compiled in).
def cloudProdApiUrl = 'https://viettable-beta.vercel.app'
def validateReleaseApiUrl = tasks.register('validateReleaseApiUrl') {
    inputs.property('apiUrl', releaseApiUrl)
    doLast {
        URI uri
        try { uri = new URI(inputs.properties.apiUrl.toString()) }
        catch (Exception ignored) { throw new GradleException('Release requires a valid VIETTABLE_API_BASE_URL HTTPS origin.') }
        def host = uri.host?.toLowerCase(Locale.ROOT)?.replaceAll(/\.$/, '')
        if (uri.scheme != 'https' || !host || uri.port != -1 || uri.userInfo || uri.query || uri.fragment ||
                !(uri.path in ['', '/']) || host == 'localhost' || host.endsWith('.localhost') ||
                host == '10.0.2.2' || host.startsWith('127.') || host.contains(':') ||
                host == '0.0.0.0' || host == 'ip6-localhost' ||
                host.endsWith('.invalid') || host.endsWith('.example') || host.endsWith('.test') ||
                host in ['example.com', 'example.net', 'example.org']) {
            throw new GradleException('Release requires VIETTABLE_API_BASE_URL=https://<real-gateway-host>; HTTP and local endpoints are forbidden.')
        }
    }
}
tasks.configureEach {
    if (name == 'preReleaseBuild') dependsOn(validateReleaseApiUrl)
}

// AGP 9 creates host unit tests only for the tested build type; also verify cloudProd's BuildConfig.
androidComponents {
    beforeVariants(selector().withBuildType('cloudProd')) { variantBuilder ->
        variantBuilder.hostTests.get(com.android.build.api.variant.HostTestBuilder.UNIT_TEST_TYPE)?.enable = true
    }
}

android {
    namespace 'com.restaurant.viettable'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.restaurant.viettable"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        def googleWebClientId = providers.gradleProperty('VIETTABLE_GOOGLE_WEB_CLIENT_ID').orElse('').get().trim()
        buildConfigField 'String', 'GOOGLE_WEB_CLIENT_ID', groovy.json.JsonOutput.toJson(googleWebClientId)
        buildConfigField 'int', 'API_READ_TIMEOUT_MS', '20000'
        buildConfigField 'int', 'IMAGE_READ_TIMEOUT_MS', '6000'
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'API_BASE_URL', groovy.json.JsonOutput.toJson(configuredApiUrl.get() ?: 'http://10.0.2.2:5100')
        }
        cloudPreview {
            initWith debug
            matchingFallbacks = ['debug']
            buildConfigField 'String', 'API_BASE_URL', groovy.json.JsonOutput.toJson(cloudPreviewApiUrl)
            // Samsung measured a 25.4 s cold response, followed by sub-second warm responses.
            // Allow serverless startup without replaying non-idempotent auth/payment mutations.
            buildConfigField 'int', 'API_READ_TIMEOUT_MS', '60000'
            buildConfigField 'int', 'IMAGE_READ_TIMEOUT_MS', '60000'
            // No debug source-set inheritance: main's system-CA, HTTPS-only policy applies.
        }
        cloudProd {
            initWith cloudPreview
            matchingFallbacks = ['debug']
            buildConfigField 'String', 'API_BASE_URL', groovy.json.JsonOutput.toJson(cloudProdApiUrl)
        }
        release {
            debuggable false
            buildConfigField 'String', 'API_BASE_URL', groovy.json.JsonOutput.toJson(releaseApiUrl)
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    implementation libs.recyclerview
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    implementation libs.camera.camera2
    implementation libs.camera.lifecycle
    implementation libs.camera.view
    implementation libs.mlkit.barcode.scanning
    implementation libs.microsoft.signalr
    implementation libs.credentials
    implementation libs.credentials.play.services.auth
    implementation libs.google.id
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.test.core
}
